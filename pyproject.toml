[project]
name = "iamtk"
version = "1.0.0"
description = "IAM Access Governance Toolkit - audit identity directory exports for least-privilege, dormant-account, MFA and SoD issues"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JP Scirica" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
iamtk = "iamtk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
